<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jogo da Velha - Local</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(to right, #fbc2eb, #a6c1ee); font-family: sans-serif; text-align: center; padding-top: 50px; }
    .tabuleiro { display: grid; grid-template-columns: repeat(3, 100px); gap: 10px; justify-content: center; margin: 30px auto; }
    .casa { width: 100px; height: 100px; font-size: 2.5rem; font-weight: bold; background: #fff; color: #333; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .vencedor { background-color: #28a745 !important; color: white; }
  </style>
</head>
<body>
  <h1>🎮 Jogo da Velha - Modo Local</h1>
  <h4 id="turno">Vez de: X</h4>
  <div id="tabuleiro" class="tabuleiro"></div>
  <button onclick="reiniciar()" class="btn btn-warning mt-3">🔁 Reiniciar</button>

  <script src="local.js"></script>
</body>
</html>
