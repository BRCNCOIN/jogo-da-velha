<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ranking - Jogo da Velha</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light text-center p-4">
  <div class="container">
    <h1 class="mb-4">🏆 Leaderboard Global</h1>
    <table class="table table-bordered table-dark table-hover">
      <thead>
        <tr>
          <th>Jogador</th>
          <th>Vitórias</th>
        </tr>
      </thead>
      <tbody id="rankingBody"></tbody>
    </table>
    <a href="index.html" class="btn btn-primary mt-3">Voltar ao Jogo</a>
  </div>
  <script>
    fetch("https://saldonline-api.onrender.com/ranking")
      .then(res => res.json())
      .then(data => {
        const tbody = document.getElementById("rankingBody");
        data.sort((a,b) => b.vitorias - a.vitorias);
        data.forEach(player => {
          const row = document.createElement("tr");
          row.innerHTML = `<td>${player.nome}</td><td>${player.vitorias}</td>`;
          tbody.appendChild(row);
        });
      });
  </script>
</body>
</html>
