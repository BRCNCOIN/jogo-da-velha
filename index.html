<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Velha</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <style>
    body {
      background: linear-gradient(to right, #00c6ff, #0072ff);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      position: relative;
    }
    .game-board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      gap: 10px;
      position: relative;
    }
    .cell {
      width: 100px;
      height: 100px;
      font-size: 3rem;
      font-weight: bold;
      background-color: white;
      color: black;
      border-radius: 10px;
      text-align: center;
      line-height: 100px;
      cursor: pointer;
    }
    .cell.x { color: #ff5722; }
    .cell.o { color: #4caf50; }
    .status {
      margin-top: 20px;
      font-size: 1.5rem;
    }
    .btn-restart {
      margin-top: 15px;
    }
    .win-line {
      position: absolute;
      height: 4px;
      background: yellow;
      z-index: 1;
      transform-origin: left;
    }
  </style>
</head>
<body>
  <div class="text-center">
    <h1>Jogo da Velha</h1>
    <div class="game-board mx-auto" id="board"></div>
    <div class="status" id="status">Vez do jogador X</div>
    <button class="btn btn-warning btn-restart" onclick="reiniciar()">Reiniciar</button>
  </div>

  <script>
    const board = document.getElementById("board");
    const statusText = document.getElementById("status");
    let currentPlayer = "X";
    let gameActive = true;
    const cells = Array(9).fill(null);
    let winLineEl = null;

    function soltarFogos() {
      var duration = 2 * 1000;
      var animationEnd = Date.now() + duration;
      var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 1000 };
      function randomInRange(min, max) {
        return Math.random() * (max - min) + min;
      }
      var interval = setInterval(function() {
        var timeLeft = animationEnd - Date.now();
        if (timeLeft <= 0) {
          return clearInterval(interval);
        }
        var particleCount = 50 * (timeLeft / duration);
        confetti({
          ...defaults,
          particleCount,
          origin: {
            x: randomInRange(0.1, 0.9),
            y: Math.random() - 0.2
          }
        });
      }, 200);
    }

    function desenharLinhaVitoria(a, b, c) {
      const cellA = board.children[a].getBoundingClientRect();
      const cellC = board.children[c].getBoundingClientRect();
      const boardRect = board.getBoundingClientRect();
      const x1 = cellA.left + cellA.width / 2 - boardRect.left;
      const y1 = cellA.top + cellA.height / 2 - boardRect.top;
      const x2 = cellC.left + cellC.width / 2 - boardRect.left;
      const y2 = cellC.top + cellC.height / 2 - boardRect.top;
      const length = Math.hypot(x2 - x1, y2 - y1);
      const angle = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
      winLineEl = document.createElement("div");
      winLineEl.className = "win-line";
      winLineEl.style.width = `${length}px`;
      winLineEl.style.left = `${x1}px`;
      winLineEl.style.top = `${y1}px`;
      winLineEl.style.transform = `rotate(${angle}deg)`;
      board.appendChild(winLineEl);
    }

    function checarVitoria() {
      const combinacoes = [
        [0,1,2],[3,4,5],[6,7,8],
        [0,3,6],[1,4,7],[2,5,8],
        [0,4,8],[2,4,6]
      ];
      for (let comb of combinacoes) {
        const [a, b, c] = comb;
        if (cells[a] && cells[a] === cells[b] && cells[a] === cells[c]) {
          gameActive = false;
          statusText.textContent = `Jogador ${cells[a]} venceu!`;
          desenharLinhaVitoria(a, b, c);
          soltarFogos();
          return;
        }
      }
      if (!cells.includes(null)) {
        gameActive = false;
        statusText.textContent = "Empate!";
      }
    }

    function clicar(i) {
      if (!gameActive || cells[i]) return;
      cells[i] = currentPlayer;
      renderizar();
      checarVitoria();
      if (gameActive) {
        currentPlayer = currentPlayer === "X" ? "O" : "X";
        statusText.textContent = `Vez do jogador ${currentPlayer}`;
      }
    }

    function renderizar() {
      board.innerHTML = "";
      cells.forEach((valor, i) => {
        const cell = document.createElement("div");
        cell.className = "cell";
        if (valor === "X") cell.classList.add("x");
        if (valor === "O") cell.classList.add("o");
        cell.textContent = valor || "";
        cell.onclick = () => clicar(i);
        board.appendChild(cell);
      });
    }

    function reiniciar() {
      for (let i = 0; i < cells.length; i++) cells[i] = null;
      currentPlayer = "X";
      gameActive = true;
      statusText.textContent = `Vez do jogador ${currentPlayer}`;
      if (winLineEl) {
        winLineEl.remove();
        winLineEl = null;
      }
      renderizar();
    }

    renderizar();
  </script>
</body>
</html>
