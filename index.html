<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jogo da Velha Online</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #222; color: #fff; text-align: center; padding-top: 20px; }
    .tabuleiro { display: grid; grid-template-columns: repeat(3, 100px); gap: 10px; justify-content: center; margin-top: 20px; }
    .casa { width: 100px; height: 100px; font-size: 2.5rem; display: flex; justify-content: center; align-items: center; background: #444; border-radius: 10px; cursor: pointer; }
    .casa:hover { background: #666; }
    .vencedor { background-color: #0f0 !important; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Jogo da Velha 🎮</h1>
    <form id="form-sala" class="row g-2 justify-content-center">
      <div class="col-auto"><input type="text" id="nome" class="form-control" placeholder="Seu nome" required></div>
      <div class="col-auto"><input type="text" id="sala" class="form-control" placeholder="Sala" required></div>
      <div class="col-auto"><input type="password" id="senha" class="form-control" placeholder="Senha (opcional)"></div>
      <div class="col-auto"><button class="btn btn-primary" type="submit">Entrar</button></div>
    </form>
    <h4 id="info" class="mt-4"></h4>
    <div id="tabuleiro" class="tabuleiro mt-3"></div>
    <h5 id="turno" class="mt-3"></h5>
  </div>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
