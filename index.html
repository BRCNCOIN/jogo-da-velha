<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jogo da Velha Moderno</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body class="bg-dark text-light text-center d-flex flex-column justify-content-center align-items-center vh-100">
  <h1 class="mb-4">🎮 Jogo da Velha</h1>
  <div class="mb-3">
    <button id="restart" class="btn btn-warning">🔁 Reiniciar</button>
    <button id="toggleTheme" class="btn btn-secondary">🌓 Tema</button>
  </div>
  <div id="board" class="board d-grid gap-2"></div>
  <audio id="clickSound" src="click.mp3" preload="auto"></audio>
  <audio id="winSound" src="win.mp3" preload="auto"></audio>

  <script src="script.js"></script>
</body>
</html>
