<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jogo da Velha Multiplayer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body class="bg-dark text-white text-center p-3">
  <div class="container">
    <h1 class="mb-3">🎮 Jogo da Velha - Multiplayer</h1>
    <div id="formulario" class="mb-3">
      <input class="form-control mb-2" id="nome" placeholder="Seu nome">
      <input class="form-control mb-2" id="sala" placeholder="Nome da sala">
      <input class="form-control mb-2" id="senha" placeholder="Senha da sala">
      <button class="btn btn-success w-100" onclick="entrar()">Entrar na Sala</button>
      <p class="text-danger mt-2" id="erro"></p>
    </div>

    <div id="jogo" style="display:none">
      <h2 id="info" class="mb-2"></h2>
      <div id="tabuleiro" class="grid mb-3"></div>
      <button class="btn btn-warning" onclick="reiniciar()">Reiniciar</button>
      <h3 class="mt-3">🏆 Placar</h3>
      <ul id="placar" class="list-group text-dark"></ul>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
