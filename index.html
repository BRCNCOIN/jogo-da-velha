<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jogo da Velha</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body {
      background: linear-gradient(to right, #667eea, #764ba2);
      color: white;
      text-align: center;
      padding-top: 100px;
      font-family: 'Segoe UI', sans-serif;
    }
    .modo-btn {
      font-size: 1.5rem;
      padding: 1rem 2rem;
      margin: 1rem;
      border-radius: 15px;
      width: 250px;
    }
  </style>

  <audio id="modoAudio" src="audio/click.mp3" preload="auto"></audio>
  <style>
    .modo-btn:hover {
      transform: scale(1.05);
      transition: transform 0.2s ease;
    }
  </style>

  <style>
    #loader {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #000;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2rem;
      z-index: 9999;
    }
    body.fade {
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
    }
  </style>
</head>


<body class="fade">
  <div class="container">
    <h1 class="mb-4">🎮 Jogo da Velha</h1>
    <h3>Escolha o modo de jogo:</h3>
    <div class="d-flex flex-column align-items-center">
      <a href="local.html" class="btn btn-success modo-btn">🧑‍🤝‍🧑 Jogar Local</a>
      <a href="online.html" class="btn btn-primary modo-btn">🌐 Multiplayer Online</a>
    </div>
  </div>

<script>
  const modoBtns = document.querySelectorAll(".modo-btn");
  const clickSound = document.getElementById("modoAudio");

  modoBtns.forEach(btn => {
    btn.addEventListener("click", () => {
      clickSound.currentTime = 0;
      clickSound.play();
    });
  });
</script>

<div id="loader">🎮 Carregando...</div>
<script>
  window.addEventListener("load", () => {
    document.body.classList.remove("fade");
    document.getElementById("loader").style.display = "none";
  });
</script>
</body>


</html>
